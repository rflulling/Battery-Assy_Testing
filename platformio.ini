; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
; Common settings for all environments
framework = arduino
monitor_speed = 115200
build_flags = 
    -D VERSION="1.0.0"
    -D PROJECT_NAME="Battery Assembly Testing"

[env:esp32dev]
; ESP32 Development Board (Primary Target)
platform = espressif32
board = esp32dev
framework = arduino

[env:esp32-s3]
; ESP32-S3 variant
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

[env:stm32h7]
; STM32H7 series support (optional)
platform = ststm32
board = nucleo_h743zi
framework = arduino

[env:milkv-duo]
; Milk-V Duo 64 support (optional, requires custom configuration)
; Note: This is experimental and may require additional setup
platform = linux_arm
board = generic
